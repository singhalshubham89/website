<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Sites</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #2b3548;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -0.03em;
    }
    .sub {
      color: var(--muted);
      margin-bottom: 24px;
    }
    .search {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      outline: none;
      margin-bottom: 24px;
    }
    .search:focus { border-color: var(--accent); }
    .grid {
      display: grid;
      gap: 16px;
    }
    .card {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #fff;
    }
    .slug {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    .card p {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }
    .tags {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      font-size: 12px;
      color: #93c5fd;
      border: 1px solid #1e3a5f;
      background: #0f172a;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .empty, .error, .hidden {
      display: none;
    }
    .empty.show, .error.show {
      display: block;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Static Sites</h1>
    <p class="sub">Each site is published at <code>/&lt;slug&gt;/</code>. Register slugs in <code>sites.json</code> and keep files in matching folders.</p>
    <input id="search" class="search" type="search" placeholder="Search by title, slug, or tag…" aria-label="Search sites">
    <div id="sites" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty">No sites match your search.</div>
    <div id="error" class="error">Could not load <code>sites.json</code>.</div>
    <footer>GitHub Pages · singhalshubham89/website</footer>
  </main>
  <script>
    const sitesEl = document.getElementById("sites");
    const emptyEl = document.getElementById("empty");
    const errorEl = document.getElementById("error");
    const searchEl = document.getElementById("search");
    let sites = [];

    function siteUrl(slug) {
      return `${slug}/`;
    }

    function render(list) {
      if (!list.length) {
        sitesEl.innerHTML = "";
        emptyEl.classList.add("show");
        return;
      }

      emptyEl.classList.remove("show");
      sitesEl.innerHTML = list.map((site) => `
        <a class="card" href="${siteUrl(site.slug)}" data-slug="${site.slug}">
          <div class="slug">/${site.slug}/</div>
          <h2>${site.title}</h2>
          <p>${site.description || ""}</p>
          ${site.tags?.length ? `<div class="tags">${site.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        </a>
      `).join("");
    }

    function filterSites(query) {
      const q = query.trim().toLowerCase();
      if (!q) return sites;
      return sites.filter((site) => {
        const haystack = [
          site.slug,
          site.title,
          site.description || "",
          ...(site.tags || []),
        ].join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    async function loadSites() {
      try {
        const res = await fetch("sites.json", { cache: "no-store" });
        if (!res.ok) throw new Error("Failed to load sites.json");
        const data = await res.json();
        sites = (data.sites || data).slice().sort((a, b) =>
          (a.title || a.slug).localeCompare(b.title || b.slug)
        );
        render(sites);
      } catch (err) {
        errorEl.classList.add("show");
      }
    }

    searchEl.addEventListener("input", () => {
      render(filterSites(searchEl.value));
    });

    loadSites();
  </script>
</body>
</html>
